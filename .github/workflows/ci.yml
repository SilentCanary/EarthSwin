name: pmgst-ci
on:
  push:
    branches: [main, "adit*"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (CPU torch + deps)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy scipy pyyaml scikit-learn pytest tqdm rasterio geopandas shapely pyproj
      - name: Tests
        run: python -m pytest tests -q
